services:
  # Các dịch vụ MinIO và Nessie giả định đã chạy ở docker-compose.yml gốc.
  # Nếu cần chạy độc lập toàn bộ, bạn có thể copy định nghĩa từ thư mục gốc vào đây.
  
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow-spark-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      NESSIE_URI: http://nessie:19120/api/v1
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - airflow-spark-data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ../19-iceberg-nessie-catalog:/opt/airflow/exercises/19-iceberg-nessie-catalog
      - ../../synthetic_bhxh:/opt/airflow/synthetic_bhxh
    networks:
      - default
      - sparkintroducelearn_default

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow-spark-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "8081:8080" # Dùng port 8081 để tránh đụng độ với Airflow ở thư mục gốc (nếu đang chạy)
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      NESSIE_URI: http://nessie:19120/api/v1
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - airflow-spark-data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ../19-iceberg-nessie-catalog:/opt/airflow/exercises/19-iceberg-nessie-catalog
      - ../../synthetic_bhxh:/opt/airflow/synthetic_bhxh
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - default
      - sparkintroducelearn_default

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow-spark-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      NESSIE_URI: http://nessie:19120/api/v1
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - airflow-spark-data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ../19-iceberg-nessie-catalog:/opt/airflow/exercises/19-iceberg-nessie-catalog
      - ../../synthetic_bhxh:/opt/airflow/synthetic_bhxh
    networks:
      - default
      - sparkintroducelearn_default

volumes:
  airflow-spark-data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
  sparkintroducelearn_default:
    external: true
