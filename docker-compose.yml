services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API endpoint (S3-compatible)
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tạo bucket mặc định cho Nessie/Iceberg ngay khi MinIO khởi động
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin password123 &&
      mc mb -p local/warehouse &&
      echo 'Bucket warehouse da san sang'
      "

  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: nessie
    ports:
      - "19120:19120"
    environment:
      # Nessie dùng bộ nhớ trong (in-memory) mặc định, không cần DB ngoài để test nhanh
      nessie.version.store.type: IN_MEMORY
      quarkus.http.port: "19120"
    depends_on:
      - minio-init

volumes:
  minio-data:
